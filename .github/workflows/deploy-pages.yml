name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "pdfs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to Pages and read the repo contents.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site (copy PDFs alongside the HTML)
        run: |
          mkdir -p site/pdfs
          cp pdfs/*.pdf site/pdfs/
          # GitHub Pages serves the directory as-is (no Jekyll processing).
          touch site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
